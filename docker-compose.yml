services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: iot-monitor-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data

  app:
    build: .
    container_name: iot-monitor-app
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deployment}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      DATABASE_FILE: backend/data/iot-monitor.db
      MQTT_URL: mqtt://mqtt:1883
      MQTT_SIMULATOR: "false"
      MQTT_TOPIC_SENSOR: data_sensor
      MQTT_TOPIC_CONTROL: device_control
      MQTT_TOPIC_RESPONSE: device_response
    volumes:
      - app_data:/app/backend/data

volumes:
  app_data:
  mosquitto_data:
